# Deploy en Render (https://render.com): New > Blueprint > elegir este repo.
services:
  - type: web
    name: parka-deposito
    runtime: python
    plan: starter            # el plan gratis se duerme y no manda el cierre automático
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /salud
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: parka-deposito-db
          property: connectionString
      - key: ADMIN_NOMBRE
        value: Vengil
      - key: ADMIN_PIN
        sync: false
      - key: CIERRE_HORA
        value: "19:00"
      - key: CIERRE_DIAS
        value: mon-sat
      - key: MAIL_TO
        value: gerencia@magontex.com.ar
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
databases:
  - name: parka-deposito-db
    plan: basic-256mb
